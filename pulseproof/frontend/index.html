<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseProof 主动光活体检测</title>
  <style>
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #121418;
      color: #fff; font-family: system-ui, sans-serif; transition: background-color 0.03s linear;
    }
    .cam-box {
      width: 280px; height: 280px; border-radius: 50%; overflow: hidden;
      border: 4px solid rgba(255,255,255,0.85); box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    button {
      margin-top: 24px; padding: 12px 32px; font-size: 16px; font-weight: 600;
      border: none; border-radius: 8px; background: #00dc78; color: #0a1912; cursor: pointer;
    }
    button:disabled { background: #555; color: #aaa; cursor: not-allowed; }
    #status { margin-top: 18px; font-size: 15px; text-align: center; max-width: 90%; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="cam-box"><video id="video" autoplay playsinline muted></video></div>
  <button id="startBtn" disabled>正在启动摄像头...</button>
  <div id="status">请将面部置于圆形取景框中央</div>
  <canvas id="grabCanvas" width="320" height="240" style="display:none;"></canvas>

  <script>
    const video = document.getElementById("video");
    const startBtn = document.getElementById("startBtn");
    const statusEl = document.getElementById("status");
    const canvas = document.getElementById("grabCanvas");
    const ctx = canvas.getContext("2d");

    navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } })
      .then(stream => {
        video.srcObject = stream;
        startBtn.disabled = false;
        startBtn.textContent = "开始 3 秒活体检测";
      })
      .catch(err => { statusEl.textContent = "摄像头权限获取失败: " + err.message; });

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      statusEl.textContent = "正在请求随机挑战序列...";

      const res = await fetch("/api/challenge?num_frames=75&fps=25", { method: "POST" });
      const challenge = await res.json();
      const colors = challenge.colors;
      const framesB64 = [];

      const intervalMs = 1000 / challenge.fps;
      const tStart = performance.now();

      for (let i = 0; i < colors.length; i++) {
        const [r, g, b] = colors[i];
        document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        statusEl.textContent = `活体挑战进行中... ${i + 1}/${colors.length}`;

        // 等待一帧画面渲染稳定后抓拍
        await new Promise(resolve => setTimeout(resolve, intervalMs));
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        framesB64.push(canvas.toDataURL("image/jpeg", 0.8));
      }

      const elapsedSec = (performance.now() - tStart) / 1000;
      const actualFps = framesB64.length / elapsedSec;
      document.body.style.backgroundColor = "#121418";
      statusEl.textContent = "正在上传至后端进行 rPPG 残差解析...";

      const verifyRes = await fetch("/api/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: challenge.session_id,
          fps: actualFps,
          frames_b64: framesB64
        })
      });
      const result = await verifyRes.json();
      statusEl.textContent = JSON.stringify(result);
      startBtn.disabled = false;
    };
  </script>
</body>
</html>
